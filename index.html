        * {

            padding: 0;

        :root {
            --bg-gradient: linear-gradient(145deg, #f0f7fe 0%, #e6eefa 100%);
            --card-bg: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.35);
            --primary-dark: #0b2a4a;
            --primary-blue: #1a4b77;
            --primary-light: #3f7fb0;

            --text-soft: #264a66;
            --shadow-sm: 0 12px 30px rgba(10, 30, 50, 0.08);
            --shadow-hover: 0 25px 45px rgba(10, 30, 50, 0.12);
            --radius-card: 28px;

            --transition-smooth: all 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.1);

        html {

        body {

            align-items: center;
            padding: 1.5rem;
            color: var(--text-dark);
            margin: 0;
            line-height: 1.6;

        /* ========== AD CONTAINERS ========== */
        .ad-container {

            justify-content: center;
            align-items: center;
            margin: var(--ad-margin);
            min-height: var(--ad-min-height);
            background: rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            overflow: hidden;
            transition: var(--transition-smooth);
        }

        .ad-container ins {
            display: block;
            width: 100%;
            min-height: var(--ad-min-height);
        }

        .ad-header {
            max-width: 728px;
            margin: 0 auto 1.5rem;
            min-height: 90px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 12px;
        }

        .ad-in-content {
            margin: 2rem 0;
            min-height: 90px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 12px;
        }

        .ad-sidebar {
            display: none;
            min-height: 600px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            margin: 0 1.5rem;
        }

        .ad-footer {
            max-width: 728px;
            margin: 1.5rem auto 0;
            min-height: 90px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 12px;
        }

        /* ========== MAIN CONTAINER ========== */
        .glass-card {
            max-width: 640px;
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(14px) saturate(160%);
            -webkit-backdrop-filter: blur(14px) saturate(160%);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-card);
            padding: 2.2rem 2rem 2rem;
            box-shadow: var(--shadow-sm);
            transition: var(--transition-smooth);
            margin: 1.5rem auto;
        }

        /* ----- Header ----- */
        .header h1 {
            font-size: 2.4rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--primary-dark);
            margin-bottom: 0.2rem;
            line-height: 1.2;
        }
        .header p {
            font-size: 1.05rem;
            color: var(--text-soft);
            font-weight: 400;
            margin-top: 0.2rem;
            border-right: 3px solid var(--primary-light);
            padding-right: 1rem;
        }

        /* ----- Search Box ----- */
        .search-box {
            margin: 2.2rem 0 1.8rem;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .input-group {
            position: relative;
            width: 100%;
        }

        .input-group input {
            width: 100%;
            padding: 1.2rem 1.8rem;
            font-size: 1.2rem;
            border: 2px solid rgba(26, 75, 119, 0.2);
            border-radius: 80px;
            background: rgba(255,255,255,0.6);
            backdrop-filter: blur(4px);
            transition: var(--transition-smooth);
            color: var(--text-dark);
            font-weight: 500;
            outline: none;
            direction: rtl;
            text-align: right;
            letter-spacing: 0.5px;
        }

        .input-group input:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 6px rgba(37, 117, 185, 0.15);
            background: #ffffff;
        }

        .input-group input::placeholder {
            color: #7a8fa0;
            font-weight: 400;
            font-size: 1.1rem;
        }

        .input-group input[type="number"]::-webkit-inner-spin-button,
        .input-group input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .input-group input[type="number"] {
            -moz-appearance: textfield;
        }

        /* ----- Button ----- */
        .btn-primary {
            position: relative;
            overflow: hidden;
            width: 100%;
            padding: 1.2rem 2rem;
            font-size: 1.35rem;
            font-weight: 600;
            border: none;
            border-radius: var(--radius-btn);
            background: linear-gradient(135deg, #1a4b77, #0b2a4a);
            color: white;
            cursor: pointer;
            box-shadow: 0 10px 24px -8px rgba(11, 42, 74, 0.35);
            transition: var(--transition-smooth);
            letter-spacing: 0.3px;
        }

        .btn-primary:hover {
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 18px 34px -10px rgba(11, 42, 74, 0.4);
            background: linear-gradient(135deg, #1f5a8a, #0d2e4e);
        }

        .btn-primary:active {
            transform: scale(0.97);
            transition: 0.08s;
        }

        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            transform: scale(0);
            animation: rippleAnim 0.7s ease-out;
            pointer-events: none;
        }
        @keyframes rippleAnim {
            to {
                transform: scale(4.5);
                opacity: 0;
            }
        }

        /* ----- Result Cards ----- */
        #resultContainer {
            margin-top: 1.8rem;
            min-height: 80px;
            animation: fadeUp 0.45s ease;
        }

        .result-card {
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(8px);
            border-radius: 30px;
            padding: 1.8rem 2rem;
            box-shadow: 0 8px 24px rgba(0,20,40,0.04);
            border: 1px solid rgba(255,255,255,0.6);
            transition: var(--transition-smooth);
            animation: fadeUp 0.5s ease;
        }

        .result-card .row {
            display: flex;
            justify-content: space-between;
            padding: 0.6rem 0;
            border-bottom: 1px solid rgba(0,0,0,0.03);
            font-size: 1.1rem;

            margin-bottom: 0.4rem;

            padding: 1.8rem 2rem;

            text-align: center;
            font-size: 1.2rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            animation: fadeUp 0.4s ease;
        }

        .info-card {
            background: rgba(255, 248, 225, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 30px;
            padding: 1.8rem 2rem;
            border: 1px solid rgba(255, 193, 7, 0.3);
            color: #856404;
            text-align: center;
            font-size: 1.2rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            animation: fadeUp 0.4s ease;
        }

        .error-card span,
        .info-card span {
            font-size: 2rem;
        }

        /* Skeleton */
        .skeleton-wrapper {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            padding: 0.5rem 0;
        }
        .skeleton-line {
            height: 1.8rem;
            border-radius: 40px;
            background: linear-gradient(90deg, #e0e7ef 25%, #f0f4fa 50%, #e0e7ef 75%);
            background-size: 200% 100%;
            animation: skeletonShimmer 1.4s infinite;
        }
        .skeleton-line.short {
            width: 55%;
        }
        .skeleton-line.long {
            width: 90%;
        }
        @keyframes skeletonShimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .spinner-center {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 0;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 5px solid rgba(26, 75, 119, 0.15);
            border-top: 5px solid var(--primary-blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ----- Footer ----- */
        .footer {
            margin-top: 2.5rem;
            font-size: 0.95rem;
            color: #4a617a;
            text-align: center;
            letter-spacing: 0.3px;
            opacity: 0.8;

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-top: 0.5rem;
            flex-wrap: wrap;

            color: #4a617a;
            text-decoration: none;
            transition: var(--transition-smooth);
            font-size: 0.9rem;
            cursor: pointer;
            border: none;
            background: none;
        }

        .footer-links a:hover {
            color: var(--primary-blue);
            text-decoration: underline;
        }

        /* ========== MODAL / POPUP (for Privacy & Terms) ========== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            animation: fadeIn 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 28px;
            max-width: 700px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            padding: 2.5rem 2rem;
            position: relative;
            box-shadow: 0 25px 60px rgba(0,0,0,0.3);
            animation: slideUp 0.3s ease;
        }

        .modal-content h1 {
            color: #0b2a4a;
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            border-bottom: 3px solid #3f7fb0;
            padding-bottom: 0.8rem;
        }

        .modal-content h2 {
            color: #1a4b77;
            font-size: 1.2rem;
            margin-top: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .modal-content p {
            margin-bottom: 0.8rem;
            line-height: 1.8;
        }

        .modal-content ul {
            margin: 0.5rem 0 1rem 2rem;
        }

        .modal-content ul li {
            margin-bottom: 0.5rem;
        }

        .modal-close {
            position: sticky;
            top: 0;
            float: left;
            background: #1a4b77;
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 1.5rem;
            cursor: pointer;
            transition: var(--transition-smooth);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .modal-close:hover {
            background: #0b2a4a;
            transform: rotate(90deg);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* ========== COOKIE NOTICE ========== */
        .cookie-notice {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(11, 42, 74, 0.95);
            backdrop-filter: blur(10px);
            color: white;
            padding: 1rem 2rem;
            display: none;
            justify-content: space-between;
            align-items: center;
            gap: 1.5rem;
            flex-wrap: wrap;
            z-index: 1000;
            font-size: 0.95rem;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.2);
            direction: rtl;
        }

        .cookie-notice.show {
            display: flex;
        }

        .cookie-notice a {
            color: #7ab7ff;
            text-decoration: underline;
            cursor: pointer;
        }

        .cookie-notice .btn-cookie {
            padding: 0.6rem 2rem;
            border: none;
            border-radius: 40px;
            background: var(--primary-light);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-smooth);
            white-space: nowrap;
        }

        .cookie-notice .btn-cookie:hover {
            background: var(--primary-blue);
            transform: scale(1.02);
        }

        /* ========== STATUS BADGE ========== */
        .status-badge {
            display: inline-block;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            background: rgba(37, 117, 185, 0.12);
            color: var(--primary-blue);
            font-weight: 600;
        }
        .status-badge.success {
            background: rgba(40, 167, 69, 0.15);
            color: #1a7a3a;
        }
        .status-badge.fail {
            background: rgba(220, 53, 69, 0.15);
            color: #a13232;
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 480px) {
            .glass-card {
                padding: 1.5rem 1.2rem;
            }
            .header h1 {
                font-size: 1.9rem;
            }
            .input-group input {
                font-size: 1rem;
                padding: 1rem 1.4rem;
            }
            .btn-primary {
                font-size: 1.1rem;
                padding: 1rem 1.5rem;
            }
            .result-card .row {
                font-size: 1rem;
                flex-wrap: wrap;
                gap: 0.2rem;
            }
            .student-name {
                font-size: 1.4rem;
            }
            .cookie-notice {
                padding: 1rem;
                font-size: 0.85rem;
            }
            .modal-content {
                padding: 1.5rem 1rem;
            }
        }

        @media (min-width: 768px) {
            .glass-card {
                padding: 2.8rem 3rem;
            }
            .search-box {
                flex-direction: row;
                align-items: center;
                gap: 1rem;
            }
            .input-group {
                flex: 3;
            }
            .btn-primary {
                flex: 1.2;
                width: auto;
                padding: 1.2rem 1.8rem;
            }
            .ad-sidebar {
                display: flex;
                min-height: 600px;
                width: 300px;
            }
            .desktop-layout {
                display: flex;
                max-width: 1200px;
                width: 100%;
                gap: 2rem;
                align-items: flex-start;
                margin: 0 auto;
            }
            .main-content {
                flex: 1;
                min-width: 0;
            }
            .sidebar-wrapper {
                flex-shrink: 0;
                width: 300px;
                position: sticky;
                top: 2rem;
            }
        }

        @media (max-width: 767px) {
            .search-box {
                flex-direction: column;
            }
            .btn-primary {
                width: 100%;
            }
            .ad-sidebar {
                display: none;
            }
            .sidebar-wrapper {
                display: none;
            }
            .desktop-layout {
                display: block;
            }
        }

        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(18px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeUp 0.45s ease forwards;
        }

        .input-group input:focus-visible,
        .btn-primary:focus-visible,
        .btn-cookie:focus-visible,
        .modal-close:focus-visible {
            outline: 3px solid #3f7fb0;
            outline-offset: 3px;
        }
    </style>
</head>

    </div>

    <script>
        (function() {
            "use strict";

            // ========== CONSTANTS ==========
            const STATUS = Object.freeze({
                0: "ناجح",
                1: "ناجح",
                2: "ناجح دور ثان",
                3: "دور ثان",
                4: "راسب",
                5: "ملغي",
                6: "محروم",
                7: "غائب"
            });

            // ========== PRIVACY & TERMS CONTENT ==========
            const PRIVACY_CONTENT = `
                <h1>🔒 سياسة الخصوصية</h1>
                <p><strong>آخر تحديث: يناير 2025</strong></p>

                <p>نحن في <strong>نتيجة الثانوية العامة</strong> نلتزم بحماية خصوصيتك. توضح هذه السياسة كيفية جمع واستخدام وحماية معلوماتك الشخصية عند استخدام موقعنا.</p>

                <h2>1. المعلومات التي نجمعها</h2>
                <p>لا نجمع أي معلومات شخصية عنك عند استخدام موقعنا. كل ما تقوم به هو إدخال رقم الجلوس للاستعلام عن النتيجة، ولا يتم تخزين هذه المعلومات.</p>

                <h2>2. ملفات تعريف الارتباط (كوكيز)</h2>
                <p>نستخدم ملفات تعريف الارتباط لتحسين تجربتك على الموقع. تساعدنا هذه الملفات في:</p>
                <ul>
                    <li>تحليل كيفية استخدام الزوار للموقع</li>
                    <li>عرض الإعلانات المناسبة (Google AdSense)</li>
                    <li>تحسين أداء الموقع وسرعته</li>
                </ul>
                <p>يمكنك التحكم في ملفات تعريف الارتباط من خلال إعدادات المتصفح الخاص بك.</p>

                <h2>3. الإعلانات</h2>
                <p>نستخدم <strong>Google AdSense</strong> لعرض الإعلانات. تستخدم Google ملفات تعريف الارتباط لعرض إعلانات مخصصة بناءً على زياراتك السابقة للمواقع الإلكترونية.</p>

                <h2>4. الروابط الخارجية</h2>
                <p>قد يحتوي موقعنا على روابط لمواقع خارجية. نحن لسنا مسؤولين عن سياسات الخصوصية لهذه المواقع.</p>

                <h2>5. حماية الأطفال</h2>
                <p>موقعنا لا يستهدف الأطفال تحت سن 13 عامًا، ولا نجمع عن قصد أي معلومات من الأطفال.</p>

                <h2>6. التغييرات على سياسة الخصوصية</h2>
                <p>قد نقوم بتحديث سياسة الخصوصية من وقت لآخر. ننصحك بمراجعة هذه الصفحة بشكل دوري.</p>

                <h2>7. الاتصال بنا</h2>
                <p>إذا كان لديك أي أسئلة، يمكنك التواصل معنا عبر البريد الإلكتروني: <strong>support@YOUR_DOMAIN.com</strong></p>
            `;

            const TERMS_CONTENT = `
                <h1>📋 شروط الاستخدام</h1>
                <p><strong>آخر تحديث: يناير 2025</strong></p>

                <p>باستخدامك لموقع <strong>نتيجة الثانوية العامة</strong>، فإنك توافق على الالتزام بالشروط والأحكام التالية.</p>

                <h2>1. قبول الشروط</h2>
                <p>باستخدامك لهذا الموقع، فإنك توافق على هذه الشروط بالكامل.</p>

                <h2>2. استخدام الموقع</h2>
                <ul>
                    <li>الموقع متاح للاستخدام الشخصي وغير التجاري فقط</li>
                    <li>لا يجوز استخدام الموقع لأي غرض غير قانوني</li>
                    <li>لا يجوز محاولة اختراق أو تعطيل عمل الموقع</li>
                </ul>

                <h2>3. دقة المعلومات</h2>
                <p>نحن نبذل قصارى جهدنا لتوفير معلومات دقيقة، لكننا لا نضمن دقة أو اكتمال المعلومات المعروضة.</p>

                <h2>4. الملكية الفكرية</h2>
                <p>جميع المحتويات المعروضة على هذا الموقع محمية بحقوق الملكية الفكرية.</p>

                <h2>5. الإعلانات</h2>
                <p>يعرض الموقع إعلانات من <strong>Google AdSense</strong>. نحن لا نتحكم في محتوى هذه الإعلانات.</p>

                <h2>6. حدود المسؤولية</h2>
                <p>نحن لسنا مسؤولين عن أي أضرار مباشرة أو غير مباشرة ناتجة عن استخدام الموقع.</p>

                <h2>7. التغييرات على الشروط</h2>
                <p>نحتفظ بالحق في تعديل هذه الشروط في أي وقت.</p>

                <h2>8. الاتصال بنا</h2>
                <p>إذا كان لديك أي استفسار: <strong>support@YOUR_DOMAIN.com</strong></p>
            `;

            // ========== DOM REFS ==========
            const seatInput = document.getElementById('seatInput');
            const searchBtn = document.getElementById('searchBtn');
            const resultContainer = document.getElementById('resultContainer');
            const modalOverlay = document.getElementById('modalOverlay');
            const modalBody = document.getElementById('modalBody');

            // ========== CACHE ==========
            const cache = new Map();

            // ========== MODAL FUNCTIONS ==========
            window.openModal = function(type) {
                if (type === 'privacy') {
                    modalBody.innerHTML = PRIVACY_CONTENT;
                } else if (type === 'terms') {
                    modalBody.innerHTML = TERMS_CONTENT;
                }
                modalOverlay.classList.add('active');
                document.body.style.overflow = 'hidden';
            };

            window.closeModal = function() {
                modalOverlay.classList.remove('active');
                document.body.style.overflow = '';
            };

            window.closeModalOutside = function(e) {
                if (e.target === modalOverlay) {
                    closeModal();
                }
            };

            // Close modal with Escape key
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && modalOverlay.classList.contains('active')) {
                    closeModal();
                }
            });

            // ========== COOKIE NOTICE ==========
            function initCookieNotice() {
                const cookieNotice = document.getElementById('cookieNotice');
                const acceptBtn = document.getElementById('cookieAcceptBtn');
                
                if (localStorage.getItem('cookieAccepted') === 'true') {
                    cookieNotice.classList.remove('show');
                    return;
                }

                cookieNotice.classList.add('show');

                acceptBtn.addEventListener('click', function() {
                    localStorage.setItem('cookieAccepted', 'true');
                    cookieNotice.classList.remove('show');
                });
            }

            // ========== RIPPLE EFFECT ==========
            function addRipple(e) {
                const btn = e.currentTarget;
                const rect = btn.getBoundingClientRect();
                const ripple = document.createElement('span');
                ripple.className = 'ripple';
                const size = Math.max(rect.width, rect.height);
                ripple.style.width = ripple.style.height = size + 'px';
                const x = (e.clientX || e.touches?.[0]?.clientX || rect.left + rect.width/2) - rect.left - size/2;
                const y = (e.clientY || e.touches?.[0]?.clientY || rect.top + rect.height/2) - rect.top - size/2;
                ripple.style.left = x + 'px';
                ripple.style.top = y + 'px';
                btn.appendChild(ripple);
                setTimeout(() => ripple.remove(), 700);
            }

            searchBtn.addEventListener('click', addRipple);

            // ========== RENDER FUNCTIONS ==========

            function showSkeleton() {
                resultContainer.innerHTML = `
                    <div class="skeleton-wrapper fade-in">
                        <div class="skeleton-line long"></div>
                        <div class="skeleton-line short"></div>
                        <div class="skeleton-line long"></div>
                    </div>
                `;
            }

            function renderStudent(seat, studentData) {
                const statusText = STATUS[studentData.s] || "غير معروف";
                let badgeClass = 'status-badge';
                if (studentData.s === 0 || studentData.s === 1 || studentData.s === 2) {
                    badgeClass += ' success';
                } else if (studentData.s === 4) {
                    badgeClass += ' fail';
                }

                resultContainer.innerHTML = `
                    <div class="result-card fade-in">
                        <div class="student-name">${studentData.n}</div>
                        <div class="row"><span class="result-label">رقم الجلوس</span><span class="result-value">${seat}</span></div>
                        <div class="row"><span class="result-label">المجموع</span><span class="result-value">${studentData.t}</span></div>
                        <div class="row"><span class="result-label">الحالة</span><span class="result-value"><span class="${badgeClass}">${statusText}</span></span></div>
                    </div>
                `;
            }

            function renderNotFound() {
                resultContainer.innerHTML = `
                    <div class="error-card fade-in">
                        <span>❌</span> لم يتم العثور على رقم الجلوس
                    </div>
                `;
            }

            function renderNotAnnounced() {
                resultContainer.innerHTML = `
                    <div class="info-card fade-in">
                        <span>⏳</span> لم يتم الإعلان عن النتيجة بعد
                    </div>
                `;
            }

            function renderNetworkError(msg = 'حدث خطأ أثناء تحميل البيانات') {
                resultContainer.innerHTML = `
                    <div class="error-card fade-in" style="background:rgba(255,235,235,0.7);border-color:rgba(200,60,60,0.2);">
                        <span>⚠️</span> ${msg}
                    </div>
                `;
            }

            // ========== CORE SEARCH LOGIC ==========
            async function performSearch(seatNumber) {
                const seat = String(seatNumber).trim();
                if (!seat || seat.length === 0) {
                    renderNetworkError('الرجاء إدخال رقم الجلوس');
                    return;
                }

                if (!/^\d+$/.test(seat)) {
                    renderNetworkError('رقم الجلوس يجب أن يحتوي على أرقام فقط');
                    return;
                }

                const prefix = seat.substring(0, 3);
                if (prefix.length < 3) {
                    renderNetworkError('رقم الجلوس يجب أن يكون مكوناً من 3 أرقام على الأقل');
                    return;
                }

                showSkeleton();

                try {
                    let data = null;
                    if (cache.has(prefix)) {
                        data = cache.get(prefix);
                    } else {
                        const response = await fetch(`data/${prefix}.json`);
                        
                        if (response.status === 404) {
                            renderNotAnnounced();
                            return;
                        }

                        if (!response.ok) {
                            throw new Error(`خطأ في التحميل (${response.status})`);
                        }

                        data = await response.json();
                        if (!data || typeof data !== 'object' || !data.students) {
                            throw new Error('بيانات غير صالحة');
                        }
                        cache.set(prefix, data);
                    }

                    const student = data.students[seat];
                    if (!student) {
                        renderNotFound();
                        return;
                    }

                    renderStudent(seat, student);

                } catch (err) {
                    console.warn('Search error:', err);
                    let msg = 'حدث خطأ أثناء البحث';
                    if (err.message.includes('بيانات غير صالحة')) {
                        msg = 'صيغة البيانات غير صالحة';
                    } else if (err.message.includes('Failed to fetch') || err.message.includes('NetworkError')) {
                        msg = 'فشل الاتصال، تحقق من اتصالك بالإنترنت';
                    } else {
                        msg = err.message || 'خطأ غير معروف';
                    }
                    renderNetworkError(msg);
                }
            }

            // ========== EVENT HANDLERS ==========

            searchBtn.addEventListener('click', function(e) {
                e.preventDefault();
                const val = seatInput.value;
                performSearch(val);
            });

            seatInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const val = seatInput.value;
                    performSearch(val);
                }
            });

            // ========== ACCESSIBILITY ==========
            seatInput.setAttribute('aria-describedby', 'searchBtn');
            seatInput.focus();

            // ========== INIT ==========
            initCookieNotice();

            console.log('✅ نظام الاستعلام جاهز (مع أرقام AdSense الخاصة بك)');
        })();
    </script>
</body>
</html>
