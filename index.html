<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>VexoLab - نتيجة الثانوية العامة</title>
    <meta name="description" content="استعلام سريع عن نتيجة الثانوية العامة المصرية باستخدام رقم الجلوس. نظام حديث وموثوق.">
    <meta name="keywords" content="ثانوية عامة, نتيجة, استعلام, رقم الجلوس, مصر, 2025">
    <meta name="theme-color" content="#0b1d2e">
    
    <!-- Open Graph -->
    <meta property="og:title" content="VexoLab | نتيجة الثانوية العامة">
    <meta property="og:description" content="استعلام فوري بنظام تكنولوجي.">

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">

    <style>
        /* ----- CSS Variables & Reset ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* ألوان مستوحاة من اللوجو (الأزرق المعدني والنيون) */
            --bg-color: #03080e; /* لون خلفية داكن جداً */
            --bg-gradient: radial-gradient(circle at 50% 0%, #162a42 0%, #03080e 70%);
            --card-bg: rgba(13, 27, 42, 0.6);
            --glass-border: rgba(54, 143, 255, 0.2);
            
            --neon-glow: rgba(0, 150, 255, 0.4);
            --neon-text: #00c3ff;
            
            --primary-dark: #0b1d2e;
            --primary-blue: #1a6bbd;
            --primary-light: #4da6ff;
            --accent: #00a6ff;
            
            --text-main: #e0f0ff;
            --text-soft: #88b0d6;
            
            --shadow-sm: 0 12px 30px rgba(0, 20, 40, 0.5);
            --shadow-hover: 0 25px 45px rgba(0, 100, 255, 0.2);
            --radius-card: 28px;
            --radius-btn: 60px;
            --transition-smooth: all 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.1);
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            color: var(--text-main);
            margin: 0;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* ----- Main Container (Glassmorphism Dark) ----- */
        .glass-card {
            max-width: 640px;
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(14px) saturate(160%);
            -webkit-backdrop-filter: blur(14px) saturate(160%);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-card);
            padding: 2.2rem 2rem 2rem;
            box-shadow: var(--shadow-sm), 0 0 40px rgba(0, 100, 255, 0.05);
            transition: var(--transition-smooth);
            margin: 1.5rem auto;
            position: relative;
        }
        
        /* تأثير الخطوط التكنولوجية (مثل اللوجو) */
        .glass-card::before {
            content: '';
            position: absolute;
            top: -2px; left: 20%; right: 20%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            border-radius: 100%;
            filter: blur(2px);
            opacity: 0.7;
        }

        /* ----- Header & Logo Text ----- */
        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        
        .logo-icon-container {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(0, 150, 255, 0.2), rgba(0, 0, 0, 0.8));
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 1rem;
            border: 1px solid rgba(0, 150, 255, 0.3);
            box-shadow: 0 0 30px rgba(0, 100, 255, 0.2);
            position: relative;
        }
        
        .logo-icon-container span {
            font-size: 2.8rem;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 15px var(--accent), 0 0 30px var(--primary-blue);
        }

        .header h1 {
            font-size: 3.2rem;
            font-weight: 900;
            letter-spacing: 4px;
            line-height: 1.1;
            margin-bottom: 0.2rem;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffffff, #00c3ff, #4da6ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 20px rgba(0, 100, 255, 0.3);
        }
        
        .header p {
            font-size: 1.05rem;
            color: var(--text-soft);
            font-weight: 400;
            margin-top: 0.2rem;
            border-right: 3px solid var(--accent);
            padding-right: 1rem;
            letter-spacing: 1px;
        }

        /* ----- Search Box ----- */
        .search-box {
            margin: 2.2rem 0 1.8rem;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .input-group {
            position: relative;
            width: 100%;
        }

        .input-group input {
            width: 100%;
            padding: 1.2rem 1.8rem;
            font-size: 1.2rem;
            border: 2px solid rgba(0, 150, 255, 0.2);
            border-radius: 80px;
            background: rgba(0, 10, 20, 0.6);
            backdrop-filter: blur(4px);
            transition: var(--transition-smooth);
            color: var(--text-main);
            font-weight: 500;
            outline: none;
            direction: rtl;
            text-align: right;
            letter-spacing: 0.5px;
        }

        .input-group input:focus {
            border-color: var(--primary-light);
            box-shadow: 0 0 0 6px rgba(0, 150, 255, 0.15), inset 0 0 15px rgba(0, 150, 255, 0.05);
            background: rgba(0, 20, 40, 0.8);
        }

        .input-group input::placeholder {
            color: #5a7a9a;
            font-weight: 400;
            font-size: 1.1rem;
        }

        /* Remove number arrows */
        .input-group input[type="number"]::-webkit-inner-spin-button,
        .input-group input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .input-group input[type="number"] {
            -moz-appearance: textfield;
        }

        /* ----- Button with Ripple & Neon ----- */
        .btn-primary {
            position: relative;
            overflow: hidden;
            width: 100%;
            padding: 1.2rem 2rem;
            font-size: 1.35rem;
            font-weight: 700;
            border: none;
            border-radius: var(--radius-btn);
            background: linear-gradient(135deg, #003366, #001a33);
            color: var(--text-main);
            cursor: pointer;
            box-shadow: 0 10px 24px -8px rgba(0, 100, 255, 0.4), inset 0 0 20px rgba(0, 150, 255, 0.1);
            transition: var(--transition-smooth);
            letter-spacing: 1px;
            text-transform: uppercase;
            border: 1px solid rgba(0, 150, 255, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 18px 34px -10px rgba(0, 100, 255, 0.6), 0 0 20px var(--neon-glow);
            background: linear-gradient(135deg, #004a99, #002244);
        }

        .btn-primary:active {
            transform: scale(0.97);
            transition: 0.08s;
        }

        /* Ripple effect */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(0, 150, 255, 0.4);
            transform: scale(0);
            animation: rippleAnim 0.7s ease-out;
            pointer-events: none;
        }
        @keyframes rippleAnim {
            to { transform: scale(4.5); opacity: 0; }
        }

        /* ----- Result / Status Cards ----- */
        #resultContainer {
            margin-top: 1.8rem;
            min-height: 80px;
            animation: fadeUp 0.45s ease;
        }

        .result-card {
            background: rgba(0, 15, 30, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 30px;
            padding: 1.8rem 2rem;
            box-shadow: 0 8px 24px rgba(0,20,40,0.4);
            border: 1px solid rgba(0, 150, 255, 0.2);
            transition: var(--transition-smooth);
            animation: fadeUp 0.5s ease;
        }

        .result-card .row {
            display: flex;
            justify-content: space-between;
            padding: 0.6rem 0;
            border-bottom: 1px solid rgba(0, 150, 255, 0.1);
            font-size: 1.1rem;
        }
        .result-card .row:last-child {
            border-bottom: none;
        }
        .result-label {
            color: var(--text-soft);
            font-weight: 400;
        }
        .result-value {
            font-weight: 600;
            color: var(--text-main);
            text-align: left;
        }
        .student-name {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 0.4rem;
            text-shadow: 0 0 10px rgba(0, 100, 255, 0.3);
        }

        /* Error / Not found / Not announced */
        .error-card {
            background: rgba(40, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            border-radius: 30px;
            padding: 1.8rem 2rem;
            border: 1px solid rgba(255, 50, 50, 0.3);
            color: #ff6b6b;
            text-align: center;
            font-size: 1.2rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            animation: fadeUp 0.4s ease;
        }

        .info-card {
            background: rgba(0, 40, 60, 0.6);
            backdrop-filter: blur(8px);
            border-radius: 30px;
            padding: 1.8rem 2rem;
            border: 1px solid rgba(0, 150, 255, 0.3);
            color: #4da6ff;
            text-align: center;
            font-size: 1.2rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            animation: fadeUp 0.4s ease;
        }

        .error-card span,
        .info-card span {
            font-size: 2rem;
        }

        /* Skeleton Loader */
        .skeleton-wrapper {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            padding: 0.5rem 0;
        }
        .skeleton-line {
            height: 1.8rem;
            border-radius: 40px;
            background: linear-gradient(90deg, #0a1a2a 25%, #1a3a5a 50%, #0a1a2a 75%);
            background-size: 200% 100%;
            animation: skeletonShimmer 1.4s infinite;
        }
        .skeleton-line.short { width: 55%; }
        .skeleton-line.long { width: 90%; }
        @keyframes skeletonShimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Spinner */
        .spinner-center {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 0;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 5px solid rgba(0, 150, 255, 0.1);
            border-top: 5px solid var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            box-shadow: 0 0 15px rgba(0, 150, 255, 0.2);
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ----- Footer ----- */
        .footer {
            margin-top: 2.5rem;
            font-size: 0.95rem;
            color: #4a6a8a;
            text-align: center;
            letter-spacing: 0.3px;
            opacity: 0.8;
        }

        /* ----- Animations & Utilities ----- */
        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(18px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .fade-in { animation: fadeUp 0.45s ease forwards; }

        /* Focus-visible */
        .input-group input:focus-visible,
        .btn-primary:focus-visible {
            outline: 3px solid var(--primary-light);
            outline-offset: 3px;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .glass-card { padding: 1.5rem 1.2rem; }
            .header h1 { font-size: 2.2rem; letter-spacing: 2px; }
            .logo-icon-container { width: 60px; height: 60px; }
            .logo-icon-container span { font-size: 2rem; }
            .input-group input { font-size: 1rem; padding: 1rem 1.4rem; }
            .btn-primary { font-size: 1.1rem; padding: 1rem 1.5rem; }
            .result-card .row { font-size: 1rem; flex-wrap: wrap; gap: 0.2rem; }
            .student-name { font-size: 1.4rem; }
        }

        @media (min-width: 768px) {
            .glass-card { padding: 2.8rem 3rem; }
            .search-box { flex-direction: row; align-items: center; gap: 1rem; }
            .input-group { flex: 3; }
            .btn-primary { flex: 1.2; width: auto; padding: 1.2rem 1.8rem; }
        }

        @media (max-width: 767px) {
            .search-box { flex-direction: column; }
            .btn-primary { width: 100%; }
        }

        .status-badge {
            display: inline-block;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            background: rgba(0, 150, 255, 0.15);
            color: var(--accent);
            font-weight: 600;
            border: 1px solid rgba(0, 150, 255, 0.1);
        }
        .status-badge.success { background: rgba(40, 200, 100, 0.15); color: #00ff88; border-color: rgba(0, 255, 136, 0.2); }
        .status-badge.fail { background: rgba(255, 50, 50, 0.15); color: #ff6b6b; border-color: rgba(255, 80, 80, 0.2); }


        /* ----- Popup Overlay (Instagram Follow - Neon Style) ----- */
        #popupOverlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 8, 14, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        #popupOverlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .popup-box {
            background: rgba(10, 25, 45, 0.9);
            max-width: 400px;
            width: 90%;
            border-radius: 30px;
            padding: 2.5rem 2rem;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8), 0 0 40px rgba(0, 100, 255, 0.2);
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            border: 1px solid rgba(0, 150, 255, 0.3);
        }
        #popupOverlay.active .popup-box {
            transform: scale(1);
        }

        .popup-box h2 {
            color: var(--text-main);
            margin-bottom: 1rem;
            font-size: 1.6rem;
            text-shadow: 0 0 10px rgba(0, 100, 255, 0.3);
        }
        .popup-box p {
            color: var(--text-soft);
            margin-bottom: 2rem;
            font-size: 1.1rem;
            line-height: 1.6;
        }
        
        .popup-logo-icon {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(0, 150, 255, 0.3), rgba(0, 0, 0, 0.8));
            margin: 0 auto 1rem;
            border: 1px solid rgba(0, 150, 255, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 20px rgba(0, 100, 255, 0.3);
        }
        .popup-logo-icon span {
            font-size: 2.5rem;
            font-weight: bold;
            color: white;
            text-shadow: 0 0 10px var(--accent);
        }

        .btn-instagram {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(45deg, #f09433 0%,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888 100%); 
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 8px 20px rgba(225, 48, 108, 0.4);
            transition: var(--transition-smooth);
            width: 100%;
        }
        .btn-instagram:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 28px rgba(225, 48, 108, 0.6);
        }
        
        .btn-skip {
            margin-top: 15px;
            background: transparent;
            border: none;
            color: #5a7a9a;
            cursor: pointer;
            font-size: 0.9rem;
            text-decoration: underline;
            transition: color 0.2s;
        }
        .btn-skip:hover {
            color: #88b0d6;
        }
    </style>
</head>
<body>
    <!-- Instagram Follow Popup Overlay -->
    <div id="popupOverlay">
        <div class="popup-box">
            <div class="popup-logo-icon">
                <span>V</span>
            </div>
            <h2>تابعنا على إنستغرام</h2>
            <p>للحصول على آخر الأخبار والتحديثات، يرجى متابعة حسابنا على إنستغرام أولاً:</p>
            
            <a href="https://www.instagram.com/_vexo.lab__?igsh=aGFya2o5MW41ZXU=" target="_blank" class="btn-instagram" id="followBtn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
                متابعة
            </a>
            
            <button class="btn-skip" id="closePopupBtn">تخطي (لن تعمل النتيجة بدونه)</button>
        </div>
    </div>

    <!-- Main App -->
    <main class="glass-card" role="main">
        <!-- Header with Tech Style -->
        <header class="header">
            <div class="logo-icon-container">
                <span>V</span>
            </div>
            <h1>VEXOLAB</h1>
            <p>نتيجة الثانوية العامة - استعلام فوري</p>
        </header>

        <!-- Search Section -->
        <section class="search-box" role="search" aria-label="استعلام نتيجة">
            <div class="input-group">
                <input type="number" id="seatInput" placeholder="أدخل رقم الجلوس" aria-label="رقم الجلوس" inputmode="numeric" autofocus>
            </div>
            <button class="btn-primary" id="searchBtn" aria-label="عرض النتيجة">
                عرض النتيجة
            </button>
        </section>

        <!-- Result Container -->
        <div id="resultContainer" aria-live="polite" aria-atomic="true">
            <!-- dynamic content -->
        </div>

        <!-- Footer -->
        <footer class="footer">
            © جميع الحقوق محفوظة لدى VexoLab / م. محمد صلاح 2026
        </footer>
    </main>

    <script>
        (function() {
            "use strict";

            // ---------- CONSTANTS ----------
            const STATUS = Object.freeze({
                0: "ناجح",
                1: "ناجح",
                2: "ناجح دور ثان",
                3: "دور ثان",
                4: "راسب",
                5: "ملغي",
                6: "محروم",
                7: "غائب"
            });

            // ---------- DOM refs ----------
            const seatInput = document.getElementById('seatInput');
            const searchBtn = document.getElementById('searchBtn');
            const resultContainer = document.getElementById('resultContainer');
            
            // Popup refs
            const popupOverlay = document.getElementById('popupOverlay');
            const followBtn = document.getElementById('followBtn');
            const closePopupBtn = document.getElementById('closePopupBtn');

            // ---------- CACHE ----------
            const cache = new Map();

            // ---------- POPUP LOGIC ----------
            let isUnlocked = false;

            if (sessionStorage.getItem('vexolab_unlocked') === 'true') {
                isUnlocked = true;
            } else {
                setTimeout(() => {
                    popupOverlay.classList.add('active');
                }, 500);
            }

            followBtn.addEventListener('click', function() {
                window.open('https://www.instagram.com/_vexo.lab__?igsh=aGFya2o5MW41ZXU=', '_blank');
                isUnlocked = true;
                sessionStorage.setItem('vexolab_unlocked', 'true');
                popupOverlay.classList.remove('active');
            });

            closePopupBtn.addEventListener('click', function() {
                popupOverlay.classList.remove('active');
            });

            popupOverlay.addEventListener('click', function(e) {
                if (e.target === popupOverlay) { /* Do nothing */ }
            });

            // ---------- RIPPLE EFFECT ----------
            function addRipple(e) {
                const btn = e.currentTarget;
                const rect = btn.getBoundingClientRect();
                const ripple = document.createElement('span');
                ripple.className = 'ripple';
                const size = Math.max(rect.width, rect.height);
                ripple.style.width = ripple.style.height = size + 'px';
                const x = (e.clientX || e.touches?.[0]?.clientX || rect.left + rect.width/2) - rect.left - size/2;
                const y = (e.clientY || e.touches?.[0]?.clientY || rect.top + rect.height/2) - rect.top - size/2;
                ripple.style.left = x + 'px';
                ripple.style.top = y + 'px';
                btn.appendChild(ripple);
                setTimeout(() => ripple.remove(), 700);
            }

            searchBtn.addEventListener('click', addRipple);

            // ---------- RENDER FUNCTIONS ----------
            function showSkeleton() {
                resultContainer.innerHTML = `
                    <div class="skeleton-wrapper fade-in">
                        <div class="skeleton-line long"></div>
                        <div class="skeleton-line short"></div>
                        <div class="skeleton-line long"></div>
                    </div>
                `;
            }

            function showSpinner() {
                resultContainer.innerHTML = `
                    <div class="spinner-center fade-in">
                        <div class="spinner" role="status" aria-label="جاري التحميل"></div>
                    </div>
                `;
            }

            function renderStudent(seat, studentData) {
                const statusText = STATUS[studentData.s] || "غير معروف";
                let badgeClass = 'status-badge';
                if (studentData.s === 0 || studentData.s === 1 || studentData.s === 2) {
                    badgeClass += ' success';
                } else if (studentData.s === 4) {
                    badgeClass += ' fail';
                }

                resultContainer.innerHTML = `
                    <div class="result-card fade-in">
                        <div class="student-name">${studentData.n}</div>
                        <div class="row"><span class="result-label">رقم الجلوس</span><span class="result-value">${seat}</span></div>
                        <div class="row"><span class="result-label">المجموع</span><span class="result-value">${studentData.t}</span></div>
                        <div class="row"><span class="result-label">الحالة</span><span class="result-value"><span class="${badgeClass}">${statusText}</span></span></div>
                    </div>
                `;
            }

            function renderNotFound() {
                resultContainer.innerHTML = `
                    <div class="error-card fade-in">
                        <span>❌</span> لم يتم العثور على رقم الجلوس
                    </div>
                `;
            }

            function renderNotAnnounced() {
                resultContainer.innerHTML = `
                    <div class="info-card fade-in">
                        <span>⏳</span> لم يتم الإعلان عن النتيجة بعد
                    </div>
                `;
            }

            function renderNetworkError(msg = 'حدث خطأ أثناء تحميل البيانات') {
                resultContainer.innerHTML = `
                    <div class="error-card fade-in">
                        <span>⚠️</span> ${msg}
                    </div>
                `;
            }

            // ---------- CORE SEARCH LOGIC (async) ----------
            async function performSearch(seatNumber) {
                if (!isUnlocked) {
                    popupOverlay.classList.add('active');
                    renderNetworkError('يجب متابعة الحساب أولاً للاستعلام عن النتيجة');
                    return;
                }

                const seat = String(seatNumber).trim();
                if (!seat || seat.length === 0) {
                    renderNetworkError('الرجاء إدخال رقم الجلوس');
                    return;
                }

                if (!/^\d+$/.test(seat)) {
                    renderNetworkError('رقم الجلوس يجب أن يحتوي على أرقام فقط');
                    return;
                }

                const prefix = seat.substring(0, 3);
                if (prefix.length < 3) {
                    renderNetworkError('رقم الجلوس يجب أن يكون مكوناً من 3 أرقام على الأقل');
                    return;
                }

                showSkeleton();

                try {
                    let data = null;
                    if (cache.has(prefix)) {
                        data = cache.get(prefix);
                    } else {
                        const response = await fetch(`data/${prefix}.json`);
                        
                        if (response.status === 404) {
                            renderNotAnnounced();
                            return;
                        }

                        if (!response.ok) {
                            throw new Error(`خطأ في التحميل (${response.status})`);
                        }

                        data = await response.json();
                        if (!data || typeof data !== 'object' || !data.students) {
                            throw new Error('بيانات غير صالحة');
                        }
                        cache.set(prefix, data);
                    }

                    const student = data.students[seat];
                    if (!student) {
                        renderNotFound();
                        return;
                    }

                    renderStudent(seat, student);

                } catch (err) {
                    console.warn('Search error:', err);
                    let msg = 'حدث خطأ أثناء البحث';
                    if (err.message.includes('بيانات غير صالحة')) {
                        msg = 'صيغة البيانات غير صالحة';
                    } else if (err.message.includes('Failed to fetch') || err.message.includes('NetworkError')) {
                        msg = 'فشل الاتصال، تحقق من اتصالك بالإنترنت';
                    } else {
                        msg = err.message || 'خطأ غير معروف';
                    }
                    renderNetworkError(msg);
                }
            }

            // ---------- EVENT HANDLERS ----------
            searchBtn.addEventListener('click', function(e) {
                e.preventDefault();
                const val = seatInput.value;
                performSearch(val);
            });

            seatInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const val = seatInput.value;
                    performSearch(val);
                }
            });

            seatInput.setAttribute('aria-describedby', 'searchBtn');
            seatInput.focus();

            console.log('✅ VexoLab System Ready (Dark Tech Style)');
        })();
    </script>
</body>
</html>
