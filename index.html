<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>نتيجة الثانوية العامة - استعلام فوري</title>
    <meta name="description" content="استعلام سريع عن نتيجة الثانوية العامة المصرية باستخدام رقم الجلوس. نظام حديث وموثوق.">
    <meta name="keywords" content="ثانوية عامة, نتيجة, استعلام, رقم الجلوس, مصر, 2025">
    <meta name="theme-color" content="#0b2a4a">
    <!-- Open Graph / Twitter Card -->
    <meta property="og:title" content="نتيجة الثانوية العامة | استعلام فوري">
    <meta property="og:description" content="استعلم عن نتيجتك باستخدام رقم الجلوس بكل سهولة.">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="نتيجة الثانوية العامة">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">

    <style>
        /* ----- CSS Variables & Reset ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-gradient: linear-gradient(145deg, #f0f7fe 0%, #e6eefa 100%);
            --card-bg: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.35);
            --primary-dark: #0b2a4a;
            --primary-blue: #1a4b77;
            --primary-light: #3f7fb0;
            --accent: #2575b9;
            --text-dark: #0d1f2e;
            --text-soft: #264a66;
            --shadow-sm: 0 12px 30px rgba(10, 30, 50, 0.08);
            --shadow-hover: 0 25px 45px rgba(10, 30, 50, 0.12);
            --radius-card: 28px;
            --radius-btn: 60px;
            --transition-smooth: all 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.1);
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            color: var(--text-dark);
            margin: 0;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* ----- Main Container (Glassmorphism) ----- */
        .glass-card {
            max-width: 640px;
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(14px) saturate(160%);
            -webkit-backdrop-filter: blur(14px) saturate(160%);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-card);
            padding: 2.2rem 2rem 2rem;
            box-shadow: var(--shadow-sm);
            transition: var(--transition-smooth);
            margin: 1.5rem auto;
        }

        /* ----- Header ----- */
        .header h1 {
            font-size: 2.4rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--primary-dark);
            margin-bottom: 0.2rem;
            line-height: 1.2;
        }
        .header p {
            font-size: 1.05rem;
            color: var(--text-soft);
            font-weight: 400;
            margin-top: 0.2rem;
            border-right: 3px solid var(--primary-light);
            padding-right: 1rem;
        }

        /* ----- Search Box ----- */
        .search-box {
            margin: 2.2rem 0 1.8rem;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .input-group {
            position: relative;
            width: 100%;
        }

        .input-group input {
            width: 100%;
            padding: 1.2rem 1.8rem;
            font-size: 1.2rem;
            border: 2px solid rgba(26, 75, 119, 0.2);
            border-radius: 80px;
            background: rgba(255,255,255,0.6);
            backdrop-filter: blur(4px);
            transition: var(--transition-smooth);
            color: var(--text-dark);
            font-weight: 500;
            outline: none;
            direction: rtl;
            text-align: right;
            letter-spacing: 0.5px;
        }

        .input-group input:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 6px rgba(37, 117, 185, 0.15);
            background: #ffffff;
        }

        .input-group input::placeholder {
            color: #7a8fa0;
            font-weight: 400;
            font-size: 1.1rem;
        }

        /* Remove number arrows */
        .input-group input[type="number"]::-webkit-inner-spin-button,
        .input-group input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .input-group input[type="number"] {
            -moz-appearance: textfield;
        }

        /* ----- Button with Ripple ----- */
        .btn-primary {
            position: relative;
            overflow: hidden;
            width: 100%;
            padding: 1.2rem 2rem;
            font-size: 1.35rem;
            font-weight: 600;
            border: none;
            border-radius: var(--radius-btn);
            background: linear-gradient(135deg, #1a4b77, #0b2a4a);
            color: white;
            cursor: pointer;
            box-shadow: 0 10px 24px -8px rgba(11, 42, 74, 0.35);
            transition: var(--transition-smooth);
            letter-spacing: 0.3px;
        }

        .btn-primary:hover {
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 18px 34px -10px rgba(11, 42, 74, 0.4);
            background: linear-gradient(135deg, #1f5a8a, #0d2e4e);
        }

        .btn-primary:active {
            transform: scale(0.97);
            transition: 0.08s;
        }

        /* Ripple effect */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            transform: scale(0);
            animation: rippleAnim 0.7s ease-out;
            pointer-events: none;
        }
        @keyframes rippleAnim {
            to {
                transform: scale(4.5);
                opacity: 0;
            }
        }

        /* ----- Result / Status Cards ----- */
        #resultContainer {
            margin-top: 1.8rem;
            min-height: 80px;
            animation: fadeUp 0.45s ease;
        }

        .result-card {
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(8px);
            border-radius: 30px;
            padding: 1.8rem 2rem;
            box-shadow: 0 8px 24px rgba(0,20,40,0.04);
            border: 1px solid rgba(255,255,255,0.6);
            transition: var(--transition-smooth);
            animation: fadeUp 0.5s ease;
        }

        .result-card .row {
            display: flex;
            justify-content: space-between;
            padding: 0.6rem 0;
            border-bottom: 1px solid rgba(0,0,0,0.03);
            font-size: 1.1rem;
        }
        .result-card .row:last-child {
            border-bottom: none;
        }
        .result-label {
            color: var(--text-soft);
            font-weight: 400;
        }
        .result-value {
            font-weight: 600;
            color: var(--primary-dark);
            text-align: left;
        }
        .student-name {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--primary-dark);
            margin-bottom: 0.4rem;
        }

        /* Error / Not found / Not announced */
        .error-card {
            background: rgba(255, 235, 235, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 30px;
            padding: 1.8rem 2rem;
            border: 1px solid rgba(220, 80, 80, 0.2);
            color: #a13232;
            text-align: center;
            font-size: 1.2rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            animation: fadeUp 0.4s ease;
        }

        .info-card {
            background: rgba(255, 248, 225, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 30px;
            padding: 1.8rem 2rem;
            border: 1px solid rgba(255, 193, 7, 0.3);
            color: #856404;
            text-align: center;
            font-size: 1.2rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            animation: fadeUp 0.4s ease;
        }

        .error-card span,
        .info-card span {
            font-size: 2rem;
        }

        /* Skeleton Loader */
        .skeleton-wrapper {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            padding: 0.5rem 0;
        }
        .skeleton-line {
            height: 1.8rem;
            border-radius: 40px;
            background: linear-gradient(90deg, #e0e7ef 25%, #f0f4fa 50%, #e0e7ef 75%);
            background-size: 200% 100%;
            animation: skeletonShimmer 1.4s infinite;
        }
        .skeleton-line.short {
            width: 55%;
        }
        .skeleton-line.long {
            width: 90%;
        }
        @keyframes skeletonShimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Spinner (replaces skeleton while loading) */
        .spinner-center {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 0;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 5px solid rgba(26, 75, 119, 0.15);
            border-top: 5px solid var(--primary-blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ----- Footer ----- */
        .footer {
            margin-top: 2.5rem;
            font-size: 0.95rem;
            color: #4a617a;
            text-align: center;
            letter-spacing: 0.3px;
            opacity: 0.8;
        }

        /* ----- Animations & Utilities ----- */
        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(18px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeUp 0.45s ease forwards;
        }

        /* Focus-visible for accessibility */
        .input-group input:focus-visible,
        .btn-primary:focus-visible {
            outline: 3px solid #3f7fb0;
            outline-offset: 3px;
        }

        /* Responsive (Mobile First) */
        @media (max-width: 480px) {
            .glass-card {
                padding: 1.5rem 1.2rem;
            }
            .header h1 {
                font-size: 1.9rem;
            }
            .input-group input {
                font-size: 1rem;
                padding: 1rem 1.4rem;
            }
            .btn-primary {
                font-size: 1.1rem;
                padding: 1rem 1.5rem;
            }
            .result-card .row {
                font-size: 1rem;
                flex-wrap: wrap;
                gap: 0.2rem;
            }
            .student-name {
                font-size: 1.4rem;
            }
        }

        @media (min-width: 768px) {
            .glass-card {
                padding: 2.8rem 3rem;
            }
            .search-box {
                flex-direction: row;
                align-items: center;
                gap: 1rem;
            }
            .input-group {
                flex: 3;
            }
            .btn-primary {
                flex: 1.2;
                width: auto;
                padding: 1.2rem 1.8rem;
            }
        }

        @media (max-width: 767px) {
            .search-box {
                flex-direction: column;
            }
            .btn-primary {
                width: 100%;
            }
        }

        /* status badge colors */
        .status-badge {
            display: inline-block;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            background: rgba(37, 117, 185, 0.12);
            color: var(--primary-blue);
            font-weight: 600;
        }
        .status-badge.success {
            background: rgba(40, 167, 69, 0.15);
            color: #1a7a3a;
        }
        .status-badge.fail {
            background: rgba(220, 53, 69, 0.15);
            color: #a13232;
        }
    </style>
</head>
<body>
    <main class="glass-card" role="main">
        <!-- Header -->
        <header class="header">
            <h1>🎓 نتيجة الثانوية العامة</h1>
            <p>استعلم عن النتيجة باستخدام رقم الجلوس</p>
        </header>

        <!-- Search Section -->
        <section class="search-box" role="search" aria-label="استعلام نتيجة">
            <div class="input-group">
                <input type="number" id="seatInput" placeholder="أدخل رقم الجلوس" aria-label="رقم الجلوس" inputmode="numeric" autofocus>
            </div>
            <button class="btn-primary" id="searchBtn" aria-label="عرض النتيجة">
                عرض النتيجة
            </button>
        </section>

        <!-- Result Container -->
        <div id="resultContainer" aria-live="polite" aria-atomic="true">
            <!-- dynamic content -->
        </div>

        <!-- Footer -->
        <footer class="footer">
            © جميع  الحقوق  محفوظه لدى /م محمد صلاح 2026 
        </footer>
    </main>

    <script>
        (function() {
            "use strict";

            // ---------- CONSTANTS ----------
            const STATUS = Object.freeze({
                0: "ناجح",
                1: "ناجح",
                2: "ناجح دور ثان",
                3: "دور ثان",
                4: "راسب",
                5: "ملغي",
                6: "محروم",
                7: "غائب"
            });

            // ---------- DOM refs ----------
            const seatInput = document.getElementById('seatInput');
            const searchBtn = document.getElementById('searchBtn');
            const resultContainer = document.getElementById('resultContainer');

            // ---------- Cache ----------
            const cache = new Map();

            // ---------- RIPPLE EFFECT ----------
            function addRipple(e) {
                const btn = e.currentTarget;
                const rect = btn.getBoundingClientRect();
                const ripple = document.createElement('span');
                ripple.className = 'ripple';
                const size = Math.max(rect.width, rect.height);
                ripple.style.width = ripple.style.height = size + 'px';
                const x = (e.clientX || e.touches?.[0]?.clientX || rect.left + rect.width/2) - rect.left - size/2;
                const y = (e.clientY || e.touches?.[0]?.clientY || rect.top + rect.height/2) - rect.top - size/2;
                ripple.style.left = x + 'px';
                ripple.style.top = y + 'px';
                btn.appendChild(ripple);
                setTimeout(() => ripple.remove(), 700);
            }

            searchBtn.addEventListener('click', addRipple);

            // ---------- RENDER FUNCTIONS ----------

            function showSkeleton() {
                resultContainer.innerHTML = `
                    <div class="skeleton-wrapper fade-in">
                        <div class="skeleton-line long"></div>
                        <div class="skeleton-line short"></div>
                        <div class="skeleton-line long"></div>
                    </div>
                `;
            }

            function showSpinner() {
                resultContainer.innerHTML = `
                    <div class="spinner-center fade-in">
                        <div class="spinner" role="status" aria-label="جاري التحميل"></div>
                    </div>
                `;
            }

            function renderStudent(seat, studentData) {
                const statusText = STATUS[studentData.s] || "غير معروف";
                let badgeClass = 'status-badge';
                if (studentData.s === 0 || studentData.s === 1 || studentData.s === 2) {
                    badgeClass += ' success';
                } else if (studentData.s === 4) {
                    badgeClass += ' fail';
                }

                resultContainer.innerHTML = `
                    <div class="result-card fade-in">
                        <div class="student-name">${studentData.n}</div>
                        <div class="row"><span class="result-label">رقم الجلوس</span><span class="result-value">${seat}</span></div>
                        <div class="row"><span class="result-label">المجموع</span><span class="result-value">${studentData.t}</span></div>
                        <div class="row"><span class="result-label">الحالة</span><span class="result-value"><span class="${badgeClass}">${statusText}</span></span></div>
                    </div>
                `;
            }

            function renderNotFound() {
                resultContainer.innerHTML = `
                    <div class="error-card fade-in">
                        <span>❌</span> لم يتم العثور على رقم الجلوس
                    </div>
                `;
            }

            // رسالة خاصة عندما الملف غير موجود (لم يتم الإعلان عن النتيجة)
            function renderNotAnnounced() {
                resultContainer.innerHTML = `
                    <div class="info-card fade-in">
                        <span>⏳</span> لم يتم الإعلان عن النتيجة بعد
                    </div>
                `;
            }

            function renderNetworkError(msg = 'حدث خطأ أثناء تحميل البيانات') {
                resultContainer.innerHTML = `
                    <div class="error-card fade-in" style="background:rgba(255,235,235,0.7);border-color:rgba(200,60,60,0.2);">
                        <span>⚠️</span> ${msg}
                    </div>
                `;
            }

            // ---------- CORE SEARCH LOGIC (async) ----------
            async function performSearch(seatNumber) {
                const seat = String(seatNumber).trim();
                if (!seat || seat.length === 0) {
                    renderNetworkError('الرجاء إدخال رقم الجلوس');
                    return;
                }

                if (!/^\d+$/.test(seat)) {
                    renderNetworkError('رقم الجلوس يجب أن يحتوي على أرقام فقط');
                    return;
                }

                const prefix = seat.substring(0, 3);
                if (prefix.length < 3) {
                    renderNetworkError('رقم الجلوس يجب أن يكون مكوناً من 3 أرقام على الأقل');
                    return;
                }

                showSkeleton();

                try {
                    let data = null;
                    if (cache.has(prefix)) {
                        data = cache.get(prefix);
                    } else {
                        const response = await fetch(`data/${prefix}.json`);
                        
                        // 🔥 لو الملف مش موجود → "لم يتم الإعلان عن النتيجة بعد"
                        if (response.status === 404) {
                            renderNotAnnounced();
                            return;
                        }

                        if (!response.ok) {
                            throw new Error(`خطأ في التحميل (${response.status})`);
                        }

                        data = await response.json();
                        if (!data || typeof data !== 'object' || !data.students) {
                            throw new Error('بيانات غير صالحة');
                        }
                        cache.set(prefix, data);
                    }

                    const student = data.students[seat];
                    if (!student) {
                        renderNotFound();
                        return;
                    }

                    renderStudent(seat, student);

                } catch (err) {
                    console.warn('Search error:', err);
                    let msg = 'حدث خطأ أثناء البحث';
                    if (err.message.includes('بيانات غير صالحة')) {
                        msg = 'صيغة البيانات غير صالحة';
                    } else if (err.message.includes('Failed to fetch') || err.message.includes('NetworkError')) {
                        msg = 'فشل الاتصال، تحقق من اتصالك بالإنترنت';
                    } else {
                        msg = err.message || 'خطأ غير معروف';
                    }
                    renderNetworkError(msg);
                }
            }

            // ---------- EVENT HANDLERS ----------

            searchBtn.addEventListener('click', function(e) {
                e.preventDefault();
                const val = seatInput.value;
                performSearch(val);
            });

            seatInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const val = seatInput.value;
                    performSearch(val);
                }
            });

            // ---------- ACCESSIBILITY ----------
            seatInput.setAttribute('aria-describedby', 'searchBtn');
            seatInput.focus();

            console.log('✅ نظام الاستعلام جاهز (مع رسالة "لم يتم الإعلان عن النتيجة بعد")');
        })();
    </script>
</body>
</html>
